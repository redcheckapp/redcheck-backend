version: '3.8'

services:
  mysql-redcheck:
    image: mysql:8.0
    container_name: redcheck-db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: redcheck_db
      MYSQL_USER: redcheck_user
      MYSQL_PASSWORD: redcheck_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data: