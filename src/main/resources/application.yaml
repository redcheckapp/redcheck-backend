spring:
  application:
    name: RedCheck

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: ${DDL_AUTO:validate}
    show-sql: ${SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:8080}
  jwt:
    secret: ${JWT_SECRET}
  google:
    client-id: ${GOOGLE_CLIENT_ID:}
  mail:
    from: ${MAIL_FROM:RedCheck <no-reply@redcheckapp.com>}
  resend:
    api-key: ${RESEND_API_KEY:}
  frontend:
    url: ${FRONTEND_URL:http://localhost:5173}
  admin:
    # Comma-separated. Empty (the default) means nobody can reach /admin/**.
    emails: ${ADMIN_EMAILS:}
  # Commit the running image was built from; CI passes it as a Docker build
  # arg (see Dockerfile). Shown on the developer dashboard.
  git-sha: ${APP_GIT_SHA:unknown}

ai:
  engine:
    url: ${AI_ENGINE_URL}

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false