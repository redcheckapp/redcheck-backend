spring:
  application:
    name: RedCheck

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/redcheck_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:redcheck_user}
    password: ${DB_PASSWORD:redcheck_password}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: ${DDL_AUTO:update}
    show-sql: ${SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

ai:
  provider: gemini

gemini:
  api:
    key: ${GEMINI_API_KEY}
  model: gemini-2.5-flash

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false