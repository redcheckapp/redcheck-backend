spring:
  application:
    name: RedCheck

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/redcheck_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:redcheck_user}
    password: ${DB_PASSWORD:redcheck_password}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: ${DDL_AUTO:update}
    show-sql: ${SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:8080}
  jwt:
    secret: ${JWT_SECRET}

ai:
  engine:
    url: ${AI_ENGINE_URL:http://smartcheck-ai-engine:8000}

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false